name: Recover blocked Pages deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/recover-pages.yml]

permissions:
  pages: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel the stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$GH_REPO/pages/deployments/b704af40ad4ddd8b1adaae01ab3d7c723908fa05/cancel"
      - name: Request a fresh build of the current main branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$GH_REPO/pages/builds"
